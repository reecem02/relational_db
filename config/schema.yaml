metadata_columns:
- Uehling Lab ID
- Sample Location Plate
- GC3F Submission Sample ID
- Alternate ID 1
- Alternate ID 2
- Lab Unique ID 3
- Extracted by
- Top ITS Blast Hit
- ITS Top Hit Similarity
- ITS Taxonomy Comments
- Top 16S Blast Hit
- 16S Top Hit Similarity
- 16S Taxonomy Comments
- Project Funding
- Latitude
- Longitude
- Location ID
- DNA Extraction Method
- Extraction Date
- Culture ID (LTS slants)
- DNA ID
- Genome ID
- Cultured by
- NCBI genome accession
- Extraction Method
- Extraction Date(YYYY-MM-DD)
- Comments
- Comments.1
- Taxonomy comments
- Location
- Country
- Primary Assembly Filename
genomic_columns:
- lab_id
- key
- value
- seq_order
bulk_import_config:
  fasta_file_column: Primary Assembly Filename
  alternative_fasta_columns: null
  path_resolution: excel_dir
  missing_file_behavior: skip

barrnap_config:
  default_kingdom: fungi
  default_coverage: 50
  input_directory: barrnap_input/genomes
  output_directory: barrnap_output
  annotations_directory: barrnap_output/annotations
  rrna_sequences_directory: barrnap_output/rrna_sequences
  gff_annotations_directory: barrnap_output/gff_annotations
  enable_multi_criteria_filtering: true
  description: Configuration for Barrnap rRNA annotation pipeline integration
